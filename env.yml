# Conda environment for this active gel project.
# Create with ./create_conda_env (or: conda env create -f env.yml)

name: gel-tsml
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scikit-learn
  - matplotlib
  - pip
  - pip:
    # On a machine without an NVIDIA GPU, change this to plain "jax"
    - jax[cuda12]
